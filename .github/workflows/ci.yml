name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Build site
        run: python3 scripts/build.py --content-dir content/models --out dist
      - name: Validate feeds
        run: python3 -c "import xml.dom.minidom; [xml.dom.minidom.parse(p) for p in ('dist/feed.xml','dist/sitemap.xml')]"
