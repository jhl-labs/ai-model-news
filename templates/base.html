<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{page_title}}</title>
<meta name="description" content="{{page_description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{page_description}}">
<meta property="og:url" content="{{canonical}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="{{site_name}} RSS" href="{{feed_url}}">
<link rel="icon" href="data:,">
<script>
(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();
</script>
<link rel="stylesheet" href="{{rel}}assets/style.css">
</head>
<body class="{{page_class}}">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{rel}}" aria-label="{{site_name}} 홈">
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="24" height="24" rx="7" fill="var(--accent)"/>
        <circle cx="10" cy="11" r="2.2" fill="#fff"/>
        <circle cx="18" cy="11" r="2.2" fill="#fff"/>
        <circle cx="14" cy="19" r="2.2" fill="#fff"/>
        <path d="M10 11L18 11L14 19Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">{{site_name}}</span>
    </a>
    <nav class="site-nav" aria-label="주 메뉴">
      <a href="{{rel}}">Models</a>
      <a href="{{rel}}about/">About</a>
      <a href="{{rel}}feed.xml">RSS</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환" title="테마 전환">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
<main id="main" class="container">
{{body}}
</main>
<footer class="site-footer">
  <div class="container footer-inner">
    <p>데이터: Hugging Face 공개 API, 매일 자동 갱신 · 빌드 {{build_date}}</p>
    <p><a href="{{repo_url}}" rel="noopener">저장소</a> · <a href="{{rel}}feed.xml">RSS</a> · <a href="{{rel}}about/">About</a></p>
  </div>
</footer>
<script src="{{rel}}assets/app.js" defer></script>
</body>
</html>
